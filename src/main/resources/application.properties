spring.application.name=ms-edututor-sessions
server.port=8083

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:edututor_sessions}
spring.datasource.password=${DB_PASSWORD:EduTutorSes2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------- Kafka (productor)
# Este servicio PUBLICA los eventos de dominio en sessions.events, con el id de
# la sesión como key (misma sesión -> misma partición -> orden garantizado).
# KafkaConfig arma el ProducerFactory desde estas propiedades y solo agrega el
# serializer JSON (fechas en ISO-8601 y sin headers de tipo Java).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=ms-edututor-sessions
# acks=all + idempotencia: el evento se confirma cuando lo tienen todas las
# réplicas en sincronía y un reintento nunca lo duplica.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# Con el broker inaccesible send() espera hasta max.block.ms por los metadatos
# antes de fallar: 5 s en vez de los 60 s por defecto, para no colgar la petición.
spring.kafka.producer.properties.max.block.ms=5000

# Nombre del tópico (mismo valor que declara kafka-admin en su application.yml).
edututor.kafka.topic.events=sessions.events

# RabbitMQ: comandos hacia ms-edututor-notify (exchange cmd.direct). Si el
# broker no responde, la operación de sesión igual se completa (ver
# SessionCommandPublisher); el timeout corto evita bloquear la petición.
# Nodos del clúster RabbitMQ (host:puerto separados por coma); si el primero cae,
# se reconecta al siguiente. Sin RABBITMQ_ADDRESSES usa RABBITMQ_HOST/PORT.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s

# Nombres de la mensajería de comandos (exchange y rutas). Mismos valores que
# declara rabbitmq-admin; aquí solo se usa lo que este servicio publica.
edututor.rabbit.exchange.direct=cmd.direct
edututor.rabbit.email.direct-key=email.send
edututor.rabbit.session.direct-key=session.ticket
edututor.rabbit.certificate.direct-key=certificate.gen
